<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="dark">
    <style>
        html, body { background: #0f172a; color: #e2e8f0; margin: 0; height: 100%; color-scheme: dark; }
        #need-network {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background: #0f172a;
            color: #e2e8f0;
            box-sizing: border-box;
        }
        #need-network.is-on { display: flex; }
        #need-network img { width: auto; height: auto; max-width: 13.5rem; max-height: 13.5rem; object-fit: contain; margin-bottom: 16px; }
        #need-network.boot img { margin-bottom: 28px; }
        #need-network.boot h1,
        #need-network.boot p,
        #need-network.boot button { display: none !important; }
        #need-network .boot-bar {
            display: none;
            width: 7.5rem;
            height: 2px;
            overflow: hidden;
            border-radius: 999px;
            background: #1e293b;
        }
        #need-network.boot .boot-bar { display: block; }
        #need-network.copy .boot-bar { display: none !important; }
        #need-network .boot-bar::after {
            content: '';
            display: block;
            height: 100%;
            width: 40%;
            background: #818cf8;
            animation: tab-indeterminate 0.85s ease-in-out infinite;
        }
    </style>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Φιλαρμονική Ορχήστρα Θήβας</title>
    <!-- © Φιλαρμονική Ορχήστρα Θήβας. Source is not a licence to copy the orchestra’s data, name, or PDFs. -->
    
    <!-- PWA / Native App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Φιλαρμονική Θήβας">
    <link rel="apple-touch-icon" href="./thiva_app_icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <style>
        .pdf-viewer-container, .modal-content {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            z-index: 9999;
        }
        .pdf-viewer-container iframe, 
        .pdf-viewer-container embed {
            width: 100%;
            height: 100%;
            border: none;
        }
        .app-navbar {
            bottom: 10px;
        }
        .app-navbar::after {
            content: '';
            position: absolute;
            z-index: 0;
            top: 100%;
            left: 0;
            right: 0;
            height: 10px;
            background: rgba(30, 41, 59, 0.95);
            pointer-events: none;
        }
        html, body {
            touch-action: manipulation;
            overscroll-behavior: none;
            height: 100%;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            background: #0f172a;
            color: #e2e8f0;
        }
        body {
            min-height: 100%;
            min-height: 100dvh;
            margin: 0;
        }
        #navbar.hidden,
        #install-nudge.hidden {
            display: none !important;
        }
        #navbar:not(.hidden) {
            display: flex !important;
        }
        #nav-home img {
            width: 5rem;
            height: 5rem;
            object-fit: contain;
        }
        #pdf-viewer-container {
            display: none !important;
        }
        html.pdf-open #pdf-viewer-container {
            display: flex !important;
            flex-direction: column;
            z-index: 60;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            min-height: 100dvh;
            max-width: none;
            background: #020617;
        }
        html.pdf-open #navbar {
            display: none !important;
        }
        html.pdf-open #app {
            visibility: hidden !important;
            pointer-events: none !important;
        }
        #need-network {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background: #0f172a;
            color: #e2e8f0;
            box-sizing: border-box;
        }
        #need-network.is-on {
            display: flex;
        }
        #need-network img {
            width: auto;
            height: auto;
            max-width: 13.5rem;
            max-height: 13.5rem;
            object-fit: contain;
            margin-bottom: 16px;
        }
        #need-network h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #a5b4fc;
            margin: 0 0 12px;
        }
        #need-network p {
            font-size: 0.95rem;
            line-height: 1.45;
            color: #cbd5e1;
            max-width: 20rem;
            margin: 0;
        }
        #need-network button {
            margin-top: 20px;
            background: #4f46e5;
            color: #fff;
            border: 0;
            border-radius: 12px;
            padding: 12px 22px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
            -webkit-touch-callout: default;
        }
        #app {
            position: relative;
            height: 100%;
            max-height: 100dvh;
            overflow: hidden;
            min-height: 0;
        }
        #app,
        #content {
            overscroll-behavior: none;
        }
        #content {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        #content:not(:has(.tab-scroll)) {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 5.75rem;
        }
        .tab-sticky {
            flex-shrink: 0;
            background: #0f172a;
            padding-bottom: 0.35rem;
        }
        .tab-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
            padding-bottom: 5.75rem;
        }
        .tab-tools {
            background: #0f172a;
            padding-bottom: 0.75rem;
        }
        .tab-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.375rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            line-height: 1;
            font-weight: 600;
            background: #334155;
            color: #f1f5f9;
            border: 1px solid #64748b;
            flex-shrink: 0;
        }
        .tab-action:hover {
            background: #475569;
        }
        .tab-action-new {
            background: #059669;
            border-color: #059669;
            color: #fff;
        }
        .tab-action-new:hover {
            background: #10b981;
            border-color: #10b981;
        }
        .tab-action-danger {
            background: rgba(185, 28, 28, 0.92);
            border-color: rgba(185, 28, 28, 0.92);
            color: #fecaca;
        }
        .tab-action-danger:hover {
            background: #dc2626;
            color: #fff;
        }
        .chrome-close {
            display: inline-flex;
            width: 2.5rem;
            height: 2.5rem;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(71, 85, 105, 0.85);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
            color: #e2e8f0;
            font-size: 1.125rem;
            line-height: 1;
            flex-shrink: 0;
        }
        .ui-icon {
            display: inline-block;
            vertical-align: -0.2em;
            flex-shrink: 0;
        }
        html.tablet-shell:not(.auth-narrow) #app,
        html.tablet-shell:not(.auth-narrow) #navbar {
            max-width: none;
        }
        html.auth-narrow #app {
            max-width: 28rem;
        }
        #pdf-viewer-container {
            touch-action: none;
            width: 100%;
            max-width: none;
            padding-top: env(safe-area-inset-top, 0px);
            box-sizing: border-box;
        }
        html.pdf-open,
        html.pdf-open body {
            overflow: hidden !important;
        }
        #tab-switch-progress {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            z-index: 20;
            overflow: hidden;
            pointer-events: none;
        }
        #app.tab-loading #tab-switch-progress {
            display: block;
        }
        #app.tab-loading #content {
            opacity: 0.45;
            pointer-events: none;
        }
        #tab-switch-progress::after {
            content: '';
            display: block;
            height: 100%;
            width: 32%;
            background: #818cf8;
            animation: tab-indeterminate 0.85s ease-in-out infinite;
        }
        @keyframes tab-indeterminate {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(430%); }
        }
        #pdf-loading-cover {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(2, 6, 23, 0.94);
            color: #c7d2fe;
            font-size: 13px;
            pointer-events: auto;
        }
        #pdf-loading-cover.hidden {
            display: none !important;
        }
        #pdf-loading-cover::before {
            content: '';
            width: 28px;
            height: 28px;
            border: 3px solid #334155;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: pdf-spin 0.7s linear infinite;
        }
        #pdf-loading-cover::after {
            content: 'Φόρτωση παρτιτούρας…';
        }
        @keyframes pdf-spin {
            to { transform: rotate(360deg); }
        }
        #pdf-viewer-container > .viewer-float:not(#viewer-show-controls) {
            top: calc(env(safe-area-inset-top, 0px) + 12px);
        }
        html.install-nudge-on .tab-scroll,
        html.install-nudge-on #content:not(:has(.tab-scroll)) {
            padding-bottom: 13rem;
        }
        #install-nudge {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(5.5rem + max(10px, env(safe-area-inset-bottom)));
            z-index: 45;
            max-width: 28rem;
            margin: 0 auto;
            padding: 0 10px;
            pointer-events: none;
        }
        #install-nudge .install-nudge-card {
            pointer-events: auto;
        }
        html.tablet-shell:not(.auth-narrow) #install-nudge {
            max-width: none;
        }
        html.pdf-open #install-nudge {
            display: none !important;
        }
        #canvas-wrapper {
            touch-action: manipulation;
            overscroll-behavior: contain;
            padding: 0;
            align-items: flex-start;
        }
        #score-stage {
            position: relative;
            flex: 0 0 auto;
            transform-origin: top center;
            transition: transform 80ms ease-out;
        }
        #score-stage.pdf-resizing {
            transition: none;
        }
        #pdf-viewer-container.pdf-readonly .annotation-island,
        #pdf-viewer-container.pdf-readonly #annotation-options,
        #pdf-viewer-container.pdf-readonly #viewer-show-controls {
            display: none !important;
        }
        #pdf-viewer-container.pdf-readonly #draw-canvas {
            pointer-events: none;
        }
        #viewer-notice {
            white-space: nowrap;
            max-width: calc(100% - 24px);
        }
        .viewer-save-mark {
            position: absolute;
            inset: 0;
            z-index: 55;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .viewer-save-mark-box {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.72);
            background: rgba(15, 23, 42, 0.28);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: viewer-save-fade 1.35s ease forwards;
        }
        @keyframes viewer-save-fade {
            0% { opacity: 0; transform: scale(0.92); }
            14% { opacity: 1; transform: scale(1); }
            62% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.98); }
        }
        #score-stage.score-spring-back {
            transition: transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .viewer-chrome {
            transition: opacity 180ms ease, transform 180ms ease;
        }
        .page-indicator {
            opacity: 0;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.7);
            border-color: rgba(71, 85, 105, 0.85);
            transition: opacity 180ms ease;
        }
        .page-indicator.visible {
            opacity: 1;
        }
        #pdf-viewer-container.reader-mode .viewer-chrome {
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
        }
        #pdf-viewer-container.reader-mode #viewer-show-controls {
            opacity: 1;
            pointer-events: auto;
            transform: none;
        }
        #viewer-show-controls {
            display: block;
            bottom: max(12px, env(safe-area-inset-bottom));
            top: auto;
            right: 12px;
            border-radius: 999px;
            width: 42px;
            height: 42px;
            padding: 0;
        }
        .viewer-float {
            position: absolute;
            z-index: 30;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(71, 85, 105, 0.85);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }
        .annotation-island {
            position: absolute;
            z-index: 3;
            left: 50%;
            bottom: max(12px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(71, 85, 105, 0.85);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }
        @media (orientation: portrait) and (max-width: 600px) {
            .annotation-island {
                transform: translateX(calc(-50% - 22px)) scale(0.92);
                transform-origin: center bottom;
            }
            #viewer-show-controls {
                right: 8px;
            }
        }
        .annotation-island button {
            min-width: 38px;
            height: 36px;
            border-radius: 12px;
        }
        .annotation-popover {
            position: absolute;
            z-index: 4;
            bottom: calc(max(12px, env(safe-area-inset-bottom)) + 52px);
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 6px;
            padding: 8px;
            border-radius: 14px;
            background: rgba(30, 41, 59, 0.98);
            border: 1px solid rgba(100, 116, 139, 0.95);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }
        .annotation-popover.open {
            display: flex;
        }
        .annotation-popover button {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            border: 2px solid transparent;
        }
        .annotation-popover button.selected {
            border-color: white;
        }
        .width-option {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent !important;
            transform: none !important;
        }
        .width-option svg {
            display: block;
            width: 34px;
            height: 22px;
        }
        .push-switch {
            position: relative;
            width: 48px;
            height: 28px;
            border-radius: 999px;
            background: #334155;
            border: 0;
            flex-shrink: 0;
            padding: 0;
        }
        .push-switch.on {
            background: #059669;
        }
        .push-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            background: #fff;
            transition: transform 180ms ease;
        }
        .push-switch.on::after {
            transform: translateX(20px);
        }
        .push-switch.busy {
            opacity: 0.65;
            pointer-events: none;
        }
        @media (orientation: landscape) and (max-height: 600px) {
            #app,
            #navbar,
            #pdf-viewer-container {
                max-width: none;
            }
            #score-stage {
                transform-origin: top center;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-full overflow-hidden flex flex-col">

    <div id="need-network" class="is-on boot" role="alert">
        <img src="./thiva_boot_icon.png" alt="">
        <div class="boot-bar" aria-hidden="true"></div>
        <h1>Φιλαρμονική Ορχήστρα Θήβας</h1>
        <p id="need-network-msg">Φόρτωση...</p>
        <button type="button" id="need-network-retry" hidden onclick="window.location.reload()">Δοκιμή ξανά</button>
    </div>

    <!-- APP CONTAINER -->
    <div id="app" class="max-w-md mx-auto w-full flex-1 flex flex-col justify-between p-4">
        <div id="tab-switch-progress" aria-hidden="true"></div>
        
        <!-- DYNAMIC CONTENT AREA -->
        <div id="content" class="flex-1">
            <!-- Loaded dynamically via JavaScript -->
        </div>

        <div id="install-nudge" class="hidden" role="region" aria-label="Εγκατάσταση εφαρμογής">
            <div class="install-nudge-card bg-slate-800/95 backdrop-blur border border-indigo-500/40 rounded-xl p-3 shadow-lg">
                <p class="text-[11px] leading-relaxed text-slate-200 mb-2">Για να λαμβάνετε ειδοποιήσεις, εγκαταστήστε την εφαρμογή και ανοίξτε την από το εικονίδιο, όχι από καρτέλα.</p>
                <div class="flex gap-2">
                    <button type="button" id="install-nudge-how" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-semibold py-2 rounded-lg">Οδηγίες</button>
                    <button type="button" id="install-nudge-later" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-100 text-[11px] font-semibold py-2 rounded-lg">Αργότερα</button>
                </div>
            </div>
        </div>

        <!-- NAVIGATION BAR (Visible when logged in) -->
        <nav id="navbar" class="app-navbar hidden fixed left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 flex items-center justify-around px-1 py-1.5 max-w-md mx-auto z-50">
            <button onclick="switchTab('music')" id="nav-music" class="flex-1 flex flex-col items-center justify-center text-slate-400 font-medium text-[10px] leading-tight h-12"><svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="16" cy="16" r="3"></circle></svg><span class="block mt-1">Παρτιτούρες</span></button>
            <button onclick="switchTab('events')" id="nav-events" class="flex-1 flex flex-col items-center justify-center text-slate-400 font-medium text-[10px] leading-tight h-12"><svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><span class="block mt-1">Πρόγραμμα</span></button>
            <div aria-hidden="true" class="h-12 w-20 shrink-0"></div>
            <button onclick="switchTab('home')" id="nav-home" aria-label="Αρχική" class="absolute z-10 left-1/2 top-1/2 flex h-20 w-20 -translate-x-1/2 -translate-y-1/2 items-center justify-center">
                <img src="./thiva_home_button.png" alt="Αρχική" class="h-20 w-20 object-contain drop-shadow-[0_4px_5px_rgba(0,0,0,0.45)]">
            </button>
            <button onclick="switchTab('attendance')" id="nav-attendance" class="flex-1 flex flex-col items-center justify-center text-slate-400 font-medium text-[10px] leading-tight h-12"><svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path></svg><span class="block mt-1">Παρουσίες</span></button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex-1 flex flex-col items-center justify-center text-slate-400 font-medium text-[10px] leading-tight h-12"><svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.8-3.2 3.1-5 7-5s6.2 1.8 7 5"></path></svg><span class="block mt-1">Προφίλ</span></button>
        </nav>
    </div>

    <!-- PDF VIEWER & ANNOTATION MODAL CONTAINER -->
    <div id="pdf-viewer-container" class="hidden fixed inset-0 bg-slate-950 z-50 flex flex-col p-0 max-w-none">
        <button type="button" onclick="closePdfViewer()" aria-label="Κλείσιμο παρτιτούρας" class="viewer-chrome viewer-float left-3 text-slate-200 text-lg w-10 h-10 rounded-full">×</button>
        <div id="page-indicator" class="viewer-chrome viewer-float page-indicator right-3 px-3 py-1.5 rounded-full">

            const norm = (p) => {

            return norm(a) === norm(b);
        }

            if (!userId) return;

                try {
                    const prev = (await scoresGetMeta(userId)) || {};
                    const next = {
                        ...prev,
                        ...patch,
                        cached: { ...(prev.cached || {}), ...(patch.cached || {}) },
                        tabs: { ...(prev.tabs || {}), ...(patch.tabs || {}) },
                        userId,
                        savedAt: Date.now()
                    };
                    await scoresIdbRequest('meta', 'readwrite', (store) => store.put(next, userId));
                } catch (e) {
                    console.warn('scores meta save failed', e);
                }
            };
            const queued = scoresMetaWriteChain.then(run, run);
            scoresMetaWriteChain = queued.then(() => {}, () => {});
            return queued;
        }

        async function pdfRowToBytes(row) {
            const raw = row?.bytes;
            if (!raw) return null;
            if (typeof Blob !== 'undefined' && raw instanceof Blob) {
                return new Uint8Array(await raw.arrayBuffer());
            }
            if (raw instanceof ArrayBuffer) return new Uint8Array(raw.slice(0));
            if (raw instanceof Uint8Array) return new Uint8Array(raw);
            return null;
        }

        async function scoresGetPdf(userId, pieceId) {
            if (!userId || pieceId == null || pieceId === '') return null;
            try {
                const row = await scoresIdbRequest('pdfs', 'readonly', (store) => store.get(scoresPdfKey(userId, pieceId)));
                if (!row || row.userId !== userId) return null;
                const bytes = await pdfRowToBytes(row);
                if (!bytes) return null;
                return { ...row, bytes: bytes.buffer };
            } catch {
                return null;
            }
        }

        async function scoresPutPdf(userId, pieceId, pdfLink, bytes) {
            if (!userId || pieceId == null || !bytes) return;
            const copy = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);

            await scoresIdbRequest('pdfs', 'readwrite', (store) => store.put({

                pdfLink,
                bytes: blob,

            await scoresPutMeta(userId, { cached: { [String(pieceId)]: pdfLink } });
            offlinePdfPieceIds.add(Number(pieceId) || pieceId);
            offlinePdfLinks[String(pieceId)] = pdfLink;

            if (!drawCanvas || !highlightCanvas) return null;
            if ((drawCanvas.width <= 1 && highlightCanvas.width <= 1)) return null;
            return {
                drawing: cloneAnnotationCanvas(drawCanvas),
                highlighting: cloneAnnotationCanvas(highlightCanvas)
            };
        }

        function restoreInkBitmaps(ink) {
            if (!ink || !drawCtx || !highlightCtx) return;
            if (ink.drawing) drawCtx.drawImage(ink.drawing, 0, 0, drawCanvas.width, drawCanvas.height);
            if (ink.highlighting) highlightCtx.drawImage(ink.highlighting, 0, 0, highlightCanvas.width, highlightCanvas.height);
            if (ink.drawing) ink.drawing.width = 0;
            if (ink.highlighting) ink.highlighting.width = 0;
        }

        function applyPdfCssFit() {
            if (!pdfCanvas || !pdfDoc) return;
            const width = viewerFitWidth();
            const currentW = parseFloat(pdfCanvas.style.width) || 0;
            const currentH = parseFloat(pdfCanvas.style.height) || 0;
            if (!currentW || !currentH) return;
            if (Math.abs(currentW - width) < 2) return;
            const height = currentH * (width / currentW);
            scoreStage?.classList.add('pdf-resizing');
            [pdfCanvas, drawCanvas, highlightCanvas].forEach(canvas => {
                if (!canvas) return;
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
            });
        }

        function schedulePdfRefit() {
            if (!pdfViewerOpen()) return;

        async function runPdfRefit(token) {
            if (token !== pdfRefitToken || !pdfViewerOpen()) return;
            if (pdfRefitRunning || pageRendering) {
                pdfRefitQueued = true;
                return;
            }
            const width = viewerFitWidth();
            if (lastPdfFitWidth && Math.abs(width - lastPdfFitWidth) < 12) {
                applyPdfCssFit();
                scoreStage?.classList.remove('pdf-resizing');
                return;
            }
            pdfRefitRunning = true;
            pdfRefitQueued = false;
            ignorePdfRefitEvents(700);
            const ink = snapshotInkBitmaps();
            try {
                await renderPage(pageNum);
                restoreInkBitmaps(ink);
            } catch (error) {
                console.warn('PDF refit failed:', error);
            } finally {
                pdfRefitRunning = false;
                scoreStage?.classList.remove('pdf-resizing');
                ignorePdfRefitEvents(450);

                }
            }

        async function completeAuthFromUrl() {
            const cb = authCallbackParams();

            if (cb.accessToken) {
                const { data, error } = await supabaseClient.auth.setSession({
                    access_token: cb.accessToken,
                    refresh_token: cb.refreshToken || ''
                });
                if (data?.session) return { session: data.session, type: cb.type || 'invite', error: null };
                if (error && !isUsedAuthLinkError(error.message)) {
                    return { session: null, type: cb.type, error: error.message };
                }
            }

            const otpType = ['invite', 'recovery', 'signup', 'email', 'magiclink'].includes(cb.type)
                ? (cb.type === 'magiclink' ? 'email' : cb.type)
                : 'invite';

            if (cb.tokenHash) {
                const { error } = await supabaseClient.auth.verifyOtp({
                    token_hash: cb.tokenHash,
                    type: otpType
                });
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) return { session, type: cb.type || 'invite', error: null };
                if (error && !isUsedAuthLinkError(error.message)) {
                    return { session: null, type: cb.type, error: error.message };
                }
            }

            if (cb.token && !cb.code) {
                const { error } = await supabaseClient.auth.verifyOtp({
                    token: cb.token,
                    type: otpType
                });
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) return { session, type: cb.type || 'invite', error: null };
                if (error && !isUsedAuthLinkError(error.message)) {
                    return { session: null, type: cb.type, error: error.message };
                }
            }

            if (cb.code) {
                const { error } = await supabaseClient.auth.exchangeCodeForSession(cb.code);
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) return { session, type: cb.type || 'invite', error: null };
                if (error && !isUsedAuthLinkError(error.message)) {
                    return { session: null, type: cb.type, error: error.message };
                }
            }

            let { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                return { session, type: cb.type, error: null };
            }

            if (cb.error) {
                return {
                    session: null,
                    type: cb.type,
                    error: decodeURIComponent((cb.errorDescription || cb.error).replace(/\+/g, ' '))
                };
            }
            if (cb.code || cb.tokenHash || cb.token || cb.accessToken || ['invite', 'recovery', 'signup'].includes(cb.type)) {
                return {
                    session: null,
                    type: cb.type,
                    error: 'Δεν ολοκληρώθηκε η πρόσκληση. Ελέγξτε ότι το Site URL στο Supabase είναι η διεύθυνση της εφαρμογής, και ζητήστε νέα πρόσκληση.'
                };
            }
            return { session: null, type: cb.type, error: null };
        }

                    renderLogin();
                    hideNeedNetworkScreen();

            });

            if (blockUnofficialApp()) {

        function askServiceWorkerToActivate(reg) {
            if (!reg) return;
            if (reg.waiting) {
                try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch {}
            }
            const installing = reg.installing;
            if (installing) {
                installing.addEventListener('statechange', () => {
                    if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                        try { installing.postMessage({ type: 'SKIP_WAITING' }); } catch {}
                    }
                });
            }
        }

        function bindServiceWorkerUpdates() {

            bindServiceWorkerUpdates.done = true;
            navigator.serviceWorker.addEventListener('controllerchange', () => {

        function checkServiceWorkerUpdate() {
            if (!('serviceWorker' in navigator) || navigator.onLine === false) return;
            navigator.serviceWorker.getRegistration('./').then((reg) => {
                if (!reg) return;
                askServiceWorkerToActivate(reg);
                return reg.update();
            }).catch(() => {});
        }

        function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) return Promise.resolve(null);
            bindServiceWorkerUpdates();
            if (serviceWorkerRegistration) {
                serviceWorkerRegistration.then((reg) => {
                    askServiceWorkerToActivate(reg);
                    if (reg && navigator.onLine !== false) reg.update().catch(() => {});
                });
                return serviceWorkerRegistration;
            }

            serviceWorkerRegistration = navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
                .then(reg => {
                    askServiceWorkerToActivate(reg);
                    if (navigator.onLine !== false) reg.update().catch(() => {});
                    return reg;
                })
                .catch(err => {
                    serviceWorkerRegistration = null;
                    console.warn('Service Worker registration failed:', err);
                    return null;
                });
            return serviceWorkerRegistration;
        }

        async function initPushSupport() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.addEventListener('message', (event) => {
                    const d = event.data;
                    if (d && d.type === 'thiva-push-open') {
                        if (d.url) {
                            try {
                                const next = new URL(d.url, location.href);
                                if (next.origin === location.origin && next.hash) location.hash = next.hash;
                            } catch (e) {}
                        }
                        showPushOpenDialog(d.title, d.body);
                    }
                });
            }
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
            try {
                const reg = await readyPushRegistration();
                if (!reg) return;
                const sub = await reg.pushManager.getSubscription();
                pushSubscription = localStorage.getItem(PUSH_OPT_KEY) === '0' ? null : sub;
            } catch (e) {
                console.warn('Push init failed:', e);
            }
        }

        async function fetchProfile() {
            if (!currentUser) return;
            if (navigator.onLine === false) {
                await restoreOfflineSessionSnapshot();
                return;
            }
            try {
            let { data, error: profileByIdError } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .maybeSingle();
            if (profileByIdError && isOfflineFetchError(profileByIdError)) {
                await restoreOfflineSessionSnapshot();
                return;
            }

            const candidates = [];
            if (data) candidates.push(data);
            if (currentUser.email) {
                const { data: byEmail } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .ilike('email', currentUser.email);
                (byEmail || []).forEach(row => {
                    if (!candidates.some(c => c.id === row.id)) candidates.push(row);
                });
            }

            const candidateIds = [...new Set([
                ...candidates.map(row => row.id),
                currentUser.id
            ].filter(Boolean))];

            if (data) {
                currentProfile = data;
            } else if (candidates[0]) {
                currentProfile = candidates[0];
            } else {
                await restoreOfflineSessionSnapshot();
                if (!currentProfile?.id && !currentProfile?.first_name && !currentProfile?.last_name) {
                    currentProfile = { email: currentUser.email, role: cachedProfileRole || 'musician', instrument: 'Μη ορισμένο' };
                }
            }

            if (candidateIds.length && (data || candidates.length)) {
                let assignments = [];
                const withNames = await supabaseClient
                    .from('user_instruments')
                    .select('user_id, instrument_id, part_position, concert_set, instruments(name, is_section, is_percussion)');
                if (withNames.error && isOfflineFetchError(withNames.error) && !currentProfile?.first_name) {
                    await restoreOfflineSessionSnapshot();
                }
                if (!withNames.error) {
                    assignmentDirectory = withNames.data || [];
                    assignments = assignmentDirectory.filter(row => candidateIds.includes(row.user_id));
                } else {
                    const plain = await supabaseClient
                        .from('user_instruments')
                        .select('user_id, instrument_id, part_position, concert_set')
                        .in('user_id', candidateIds);
                    assignments = plain.error ? [] : (plain.data || []);
                    const ids = [...new Set(assignments.map(row => row.instrument_id).filter(Boolean))];
                    if (ids.length) {
                        const named = await supabaseClient.from('instruments').select('id, name, is_section, is_percussion').in('id', ids);
                        const byId = Object.fromEntries((named.data || []).map(row => [row.id, row]));
                        assignments = assignments.map(row => ({
                            ...row,
                            instruments: byId[row.instrument_id]
                                ? { name: byId[row.instrument_id].name, is_section: byId[row.instrument_id].is_section, is_percussion: byId[row.instrument_id].is_percussion }
                                : row.instruments
                        }));
                    }
                    assignmentDirectory = assignments;
                }
                const assignedIds = new Set(assignments.map(row => row.user_id).filter(Boolean));
                const ranked = candidates.slice().sort((a, b) => {
                    const score = (p) =>
                        (assignedIds.has(p.id) ? 8 : 0)
                        + (p.role === 'admin' ? 4 : p.role === 'conductor' ? 3 : 0)
                        + (((p.first_name || '').trim() || (p.last_name || '').trim()) ? 2 : 0)
                        + (p.id === currentUser.id ? 1 : 0);
                    return score(b) - score(a);
                });
                if (ranked[0]) currentProfile = ranked[0];
                const profileId = currentProfile?.id;
                if (assignments.length || (!withNames.error && Array.isArray(withNames.data))) {
                    currentProfile.assignments = profileId
                        ? assignments.filter(row => !row.user_id || row.user_id === profileId)
                        : assignments;
                } else if (!currentProfile.assignments?.length) {
                    currentProfile.assignments = [];
                }
            } else if (!currentProfile.assignments) {
                currentProfile.assignments = [];
            }
            if (currentProfile?.id || currentProfile?.first_name || currentProfile?.last_name) {
                await persistOfflineSessionSnapshot();
            }
            } catch (e) {
                console.warn('fetchProfile', e);
                await restoreOfflineSessionSnapshot();
            }
        }

        function isAdminRole() {
            return profileHasAdminRole(currentProfile) || foldedProfileRole({ role: cachedProfileRole }) === 'admin';
        }

        function isConductorRole() {
            return profileHasConductorRole(currentProfile) || profileHasConductorRole({ role: cachedProfileRole });
        }

        function foldedProfileRole(profile) {
            return String(profile?.role || '')
                .normalize('NFD')
                .replace(/\p{M}/gu, '')
                .toLowerCase()
                .trim();
        }

        function profileHasAdminRole(profile) {
            return foldedProfileRole(profile) === 'admin';
        }

        function profileHasConductorRole(profile) {
            const role = foldedProfileRole(profile);
            return role === 'conductor' || role === 'μαεστρος' || role === 'maestro';
        }

        function isMusicianRole() {
            const role = (currentProfile?.role || '').toLowerCase();
            return !isAdminRole() && !isConductorRole() && (role === 'musician' || role === 'member' || !role);
        }

        function isPrivilegedRole() {
            return isAdminRole() || isConductorRole();
        }

        function legacyAssignmentLabel() {
            const legacy = (currentProfile?.instrument || '').trim();
            if (legacy === 'Κρουστά' || legacy === 'Percussion' || legacy === 'Percussion (all)' || legacy === 'Percussion Section') return 'Percussion Section';
            if (legacy && legacy !== 'Μαέστρος' && legacy !== 'Μη ορισμένο') return legacy;
            return '';
        }

        function hasPercussionAllAssignment() {
            if ((currentProfile?.assignments || []).some(row => {
                const rel = Array.isArray(row.instruments) ? row.instruments[0] : row.instruments;
                return rel?.name === 'Percussion Section' || rel?.name === 'Percussion (all)' || rel?.is_section === true;
            })) return true;
            return legacyAssignmentLabel() === 'Percussion Section';
        }

        function canFilterMusicInstruments() {
            return isPrivilegedRole() || hasPercussionAllAssignment();
        }

        function formatEventTime(timeValue) {
            if (!timeValue) return '';
            const raw = String(timeValue).trim();
            const match = raw.match(/^(\d{1,2}):(\d{2})/);
            if (!match) return raw;
            return `${match[1].padStart(2, '0')}:${match[2]}`;
        }

        function relationName(rel) {
            if (!rel) return '';
            if (Array.isArray(rel)) return rel[0]?.name || '';
            return rel.name || '';
        }

        function instrumentUiName(name, isSection) {
            const n = (name || '').trim();
            if (isSection || n === 'Percussion (all)' || n === 'Percussion Section') return 'Percussion Section';
            if (n === 'French Horn') return 'Horn in F';
            return n;
        }

        function relationIsSection(rel) {
            if (!rel) return false;
            const row = Array.isArray(rel) ? rel[0] : rel;
            return row?.is_section === true || row?.name === 'Percussion (all)' || row?.name === 'Percussion Section';
        }

        function musicPartLabel(item) {
            const part = Array.isArray(item?.musical_parts) ? item.musical_parts[0] : item?.musical_parts;
            const instrumentName = relationName(part?.instruments);
            if (instrumentName === 'Percussion (all)' || instrumentName === 'Percussion Section' || relationIsSection(part?.instruments)) {
                return 'Percussion';
            }
            const base = instrumentName || item?.instrument_part || '';
            if (part?.is_beginner && base) return `${base} (beginner)`;
            if (part?.part_position && base) return `${base} ${part.part_position}`;
            if (part?.display_name) return part.display_name;
            return base || item?.concert_set || 'Γενικό';
        }

        function instrumentPeerCount(instrumentId) {
            if (!instrumentId) return 0;
            const users = new Set(
                (assignmentDirectory || [])
                    .filter(row => row.instrument_id === instrumentId && !row.concert_set)
                    .map(row => row.user_id)
                    .filter(Boolean)
            );
            return users.size;
        }

        function assignmentRowLabel(row) {
            const name = instrumentUiName(relationName(row.instruments), relationIsSection(row.instruments)) || 'Όργανο';
            const showPart = Boolean(row.part_position) && (isPrivilegedRole() ? instrumentPeerCount(row.instrument_id) > 1 : true);
            let label = showPart ? `${name} ${row.part_position}` : name;
            if (row.concert_set) label += ` · ${row.concert_set}`;
            return label;
        }

        function assignmentLabels() {
            const all = currentProfile?.assignments || [];
            const general = all.filter(row => !row.concert_set);
            const rows = general.length ? general : all;
            if (!rows.length) {
                const legacy = legacyAssignmentLabel();
                return legacy ? [legacy] : [];
            }
            return rows.map(assignmentRowLabel);
        }

        function primaryAssignmentRow(profile) {
            const all = profile?.assignments || [];
            const general = all.filter(row => !row.concert_set).slice().sort((a, b) => {
                const byDate = String(a.created_at || '').localeCompare(String(b.created_at || ''));
                if (byDate) return byDate;
                return String(a.id || '').localeCompare(String(b.id || ''));
            });
            return general[0] || null;
        }

        function profilePrimaryInstrumentLabel(profile) {
            const row = primaryAssignmentRow(profile);
            if (row) return assignmentRowLabel({ ...row, concert_set: null });
            if (profileHasConductorRole(profile)) return 'Μαέστρος';
            if (profileHasAdminRole(profile)) return 'Διαχειριστής';
            const legacy = (profile?.instrument || '').trim();
            if (legacy && legacy !== 'Μη ορισμένο') return legacy;
            return '';
        }

        function attendanceInstrumentSuffix(profile) {
            const label = profilePrimaryInstrumentLabel(profile);
            return label ? ` (${label})` : '';
        }

            ]);
            assignmentDirectory = rows || [];

            (rows || []).forEach(row => {
                if (!byUser[row.user_id]) byUser[row.user_id] = [];
                byUser[row.user_id].push(row);
            });
            (profiles || []).forEach(profile => {
                profile.assignments = byUser[profile.id] || [];
            });
            return { profiles: profiles || [], error: profilesError };
        }

        function getGreekVocativeName(name) {
            const trimmedName = (name || '').trim();
            if (!trimmedName) return 'μουσικέ';

            const normalizedName = trimmedName.toLocaleLowerCase('el-GR');
            const irregularForms = {
                'βασίλης': 'Βασίλη',
                'γιαννης': 'Γιάννη',
                'γιάννης': 'Γιάννη',
                'δημήτρης': 'Δημήτρη',
                'δημητρης': 'Δημήτρη',
                'γιώργος': 'Γιώργο',
                'γεώργιος': 'Γεώργιε',
                'νίκος': 'Νίκο',
                'παναγιώτης': 'Παναγιώτη',
                'χρήστος': 'Χρήστο',
                'χρηστος': 'Χρήστο',
                'κωνσταντίνος': 'Κωνσταντίνε',
                'ανδρέας': 'Ανδρέα',
                'λουκάς': 'Λουκά',
                'στέφανος': 'Στέφανε',
                'στεφανος': 'Στέφανε',
                'αλέξανδρος': 'Αλέξανδρε',
                'αλεξανδρος': 'Αλέξανδρε',
                'άγγελος': 'Άγγελε',
                'αγγελος': 'Άγγελε',
                'ευάγγελος': 'Ευάγγελε',
                'ευαγγελος': 'Ευάγγελε',
                'απόστολος': 'Απόστολε',
                'αποστολος': 'Απόστολε',
                'θεόδωρος': 'Θεόδωρε',
                'θεοδωρος': 'Θεόδωρε',
                'νικόλαος': 'Νικόλαε',
                'νικολαος': 'Νικόλαε',
                'φίλιππος': 'Φίλιππε',
                'φιλιππος': 'Φίλιππε',
                'στέλιος': 'Στέλιο',
                'στελιος': 'Στέλιο',
                'χαράλαμπος': 'Χαράλαμπε',
                'χαραλαμπος': 'Χαράλαμπε',
                'οδυσσέας': 'Οδυσσέα',
                'οδυσσεας': 'Οδυσσέα'
            };
            if (irregularForms[normalizedName]) return irregularForms[normalizedName];

            if (normalizedName.endsWith('ης') || normalizedName.endsWith('ας')) {
                return trimmedName.slice(0, -1);
            }
            if (normalizedName.endsWith('ος')) {
                const eSuffixes = ['στολος', 'νδρος', 'δωρος', 'λαος', 'τινος', 'ανος', 'γγελος', 'γελος', 'ιππος', 'λαμπος'];
                if (eSuffixes.some(suffix => normalizedName.endsWith(suffix))
                    || (normalizedName.endsWith('ιος') && normalizedName.length >= 8)) {
                    return trimmedName.slice(0, -2) + 'ε';
                }
                return trimmedName.slice(0, -1);
            }

            return trimmedName;
        }

        async function handleSetPassword() {
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('new-password-confirm').value;
            const errEl = document.getElementById('password-error-msg');
            if (!password || password.length < 8) {
                errEl.innerText = 'Ο κωδικός πρέπει να έχει τουλάχιστον 8 χαρακτήρες.';
                return;
            }
            if (password !== confirm) {
                errEl.innerText = 'Οι δύο κωδικοί δεν ταιριάζουν.';
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({ password });
            if (error) {
                errEl.innerText = error.message === 'Auth session missing!'
                    ? 'Ο σύνδεσμος έληξε ή δεν είναι έγκυρος. Ζητήστε νέα πρόσκληση ή επαναφορά κωδικού.'
                    : error.message;
                return;
            }

            requirePasswordSetup = false;
            passwordSetupMode = 'invite';
            clearAuthCallbackFromUrl();
            showAppNotice('Ο κωδικός αποθηκεύτηκε.');
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchProfile();
                renderApp();
            } else {
                renderLogin('Ο κωδικός αποθηκεύτηκε. Συνδεθείτε με το email και τον νέο κωδικό.');
            }
        }

        async function handleForgotPassword() {
            if (!isOfficialAppHost()) {
                renderLogin();
                return;
            }
            const email = (document.getElementById('email')?.value || '').trim();
            const errorEl = document.getElementById('error-msg');
            const infoEl = document.getElementById('info-msg');
            if (errorEl) errorEl.innerText = '';
            if (infoEl) infoEl.innerText = '';
            if (!email) {
                if (errorEl) errorEl.innerText = 'Γράψτε πρώτα το email σας και πατήστε ξανά «Ξεχάσατε τον κωδικό;».';
                return;
            }
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: appRedirectUrl()
            });
            if (error) {
                if (errorEl) errorEl.innerText = error.message;
                return;
            }
            if (infoEl) infoEl.innerText = 'Σας στείλαμε email με σύνδεσμο για νέο κωδικό. Ελέγξτε τα εισερχόμενα (και τα ανεπιθύμητα).';

        function startChangePassword() {
            requirePasswordSetup = true;
            passwordSetupMode = 'change';

        async function handleLogin() {
            if (!isOfficialAppHost()) {
                renderLogin();

            const password = document.getElementById('password').value;

            const nav = document.getElementById('navbar');
            if (nav) nav.classList.remove('hidden');
            ['music', 'events', 'home', 'attendance', 'profile'].forEach((t) => {
                const btn = document.getElementById(`nav-${t}`);

        function hookContentHtmlForTabScroll() {
            if (contentHtmlHooked) return;
            const el = document.getElementById('content');
            if (!el) return;
            const desc = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
            if (!desc?.get || !desc?.set) return;
            Object.defineProperty(el, 'innerHTML', {
                configurable: true,
                enumerable: true,
                get() { return desc.get.call(this); },
                set(value) {
                    desc.set.call(this, value);
                    setTabLoading(false);
                    if (!pendingTabScrollReset) return;
                    this.scrollTop = 0;
                    this.querySelectorAll('.tab-scroll').forEach((pane) => { pane.scrollTop = 0; });
                    window.scrollTo(0, 0);
                    pendingTabScrollReset = false;
                }
            });
            contentHtmlHooked = true;
        }

        function switchTab(tab) {
            if (tab === activeTab) return;
            if (tab !== 'music') musicTabShellReady = false;
            pendingTabScrollReset = true;
            activeTab = tab;
            highlightNav(tab);
            setTabLoading(true);
            hookContentHtmlForTabScroll();
            renderApp();
        }

        function applyLocationHash() {
            const h = window.location.hash;
            if (h === '#notifications') activeTab = 'notifications';

            else if (h === '#attendance') activeTab = 'attendance';
        }

        window.addEventListener('hashchange', () => {
            if (!currentUser || requirePasswordSetup) return;
            const previous = activeTab;
            applyLocationHash();
            if (previous !== activeTab) {
                pendingTabScrollReset = true;
                highlightNav(activeTab);
                setTabLoading(true);
            }
            hookContentHtmlForTabScroll();
            renderApp();

            else if (activeTab === 'profile') runTabLoad(renderProfileTab);

        async function deleteAnnouncement(id) {
            if (!isPrivilegedRole()) {
                showAppNotice('Μόνο οι διαχειριστές και ο μαέστρος μπορούν να διαγράφουν ανακοινώσεις.');
                return;

            const announcementId = Number(id);
            if (!Number.isSafeInteger(announcementId) || announcementId <= 0) {
                showAppNotice('Μη έγκυρη ανακοίνωση.');
                return;
            }
            if (!await confirmAppAction('Να διαγραφεί οριστικά αυτή η ανακοίνωση;')) return;

            const { error } = await supabaseClient
                .from('announcement_log')
                .delete()
                .eq('id', announcementId);

            if (error) {
                showAppNotice('Σφάλμα διαγραφής ανακοίνωσης: ' + error.message);
                return;
            }
            await renderNotificationsTab();
        }

        function filteredMusicRows() {
            const pool = musicLibraryCache.slice();
            const allSets = [...new Set(pool.map(m => (m.concert_set || '').trim()).filter(Boolean))].sort();
            const partNames = [...new Set(pool.map(m => musicPartLabel(m)).filter(Boolean))].sort();
            let displayed = pool.slice();

            if (canFilterMusicInstruments() && musicFilter.instrument && musicFilter.instrument !== 'all') {
                displayed = displayed.filter(m => musicPartLabel(m) === musicFilter.instrument);
            }
            if (musicFilter.set && musicFilter.set !== 'all') {
                displayed = displayed.filter(m => (m.concert_set || '').trim() === musicFilter.set);
            }
            if (musicFilter.search && musicFilter.search.trim()) {
                const q = musicFilter.search.trim().toLowerCase();
                displayed = displayed.filter(m =>
                    (m.piece_title || '').toLowerCase().includes(q) ||
                    (m.composer || '').toLowerCase().includes(q) ||
                    musicPartLabel(m).toLowerCase().includes(q) ||
                    (m.concert_set || '').toLowerCase().includes(q)
                );
            }
            displayed.sort((a, b) => {
                const title = (a.piece_title || '').localeCompare(b.piece_title || '', 'el', { sensitivity: 'base' });
                if (title !== 0) return title;
                const composer = (a.composer || '').localeCompare(b.composer || '', 'el', { sensitivity: 'base' });
                if (composer !== 0) return composer;
                // Later: secondary key should be full-score instrument order from the complete list.
                return musicPartLabel(a).localeCompare(musicPartLabel(b), 'el', { sensitivity: 'base' });
            });
            return { displayed, allSets, partNames, poolCount: pool.length };
        }

        function updateMusicSyncStatus() {
            const el = document.getElementById('music-sync-status');
            if (!el) return;
            const total = musicPdfPool().length;
            const saved = musicPdfPool().filter(pieceIsOnDevice).length;
            if (!total) {
                el.textContent = '';
                return;
            }
            if (saved >= total) {
                el.className = 'text-[11px] text-emerald-400/90 pt-1';
                el.textContent = total === 1
                    ? '1 παρτιτούρα διαθέσιμη εκτός σύνδεσης'
                    : `${total} παρτιτούρες διαθέσιμες εκτός σύνδεσης`;
                return;
            }
            if (navigator.onLine === false) {
                el.className = 'text-[11px] text-amber-200/90 pt-1';
                el.textContent = `${saved} από ${total} διαθέσιμες εκτός σύνδεσης`;
                return;
            }
            const leftover = total - saved;
            const leftoverFailed = leftover && leftover === musicPdfPool().filter((item) => !pieceIsOnDevice(item) && scorePrefetchFailedIds.has(Number(item.id))).length;
            if (scorePrefetchQuotaAt && leftover) {
                el.className = 'text-[11px] text-amber-200/90 pt-1';
                el.textContent = `${saved} διαθέσιμες εκτός σύνδεσης. Η συσκευή δεν έχει άλλο χώρο για τις υπόλοιπες ${leftover}.`;
                return;
            }
            if (!scorePrefetchInFlight && leftoverFailed) {
                el.className = 'text-[11px] text-amber-200/90 pt-1';
                el.textContent = `${saved} διαθέσιμες εκτός σύνδεσης · ${leftover} δεν κατέβηκαν. Ανοίξτε τις με σύνδεση.`;
                return;
            }
            el.className = 'text-[11px] text-indigo-300 pt-1';
            el.textContent = `Αποθηκεύονται ${saved} από ${total} στη συσκευή…`;
        }

        async function ensureMusicalPart(instrumentId, kind) {
            const instrument = (window.canonicalInstruments || []).find(ins => ins.id === instrumentId);
            if (!instrument) throw new Error('Άγνωστο όργανο.');
            const isBeginner = kind === 'beginner';
            const partPosition = kind === 'unnumbered' || isBeginner ? null : Number(kind);
            const displayName = isBeginner
                ? `${instrument.name} (beginner)`
                : partPosition ? `${instrument.name} ${partPosition}` : instrument.name;

            let query = supabaseClient
                .from('musical_parts')
                .select('id, display_name')
                .eq('instrument_id', instrumentId)
                .eq('is_beginner', isBeginner);
            query = partPosition === null ? query.is('part_position', null) : query.eq('part_position', partPosition);
            const { data: existing, error: lookupError } = await query.maybeSingle();
            if (lookupError) throw lookupError;
            if (existing) return existing;

            const { data: created, error: insertError } = await supabaseClient
                .from('musical_parts')
                .insert([{ instrument_id: instrumentId, part_position: partPosition, is_beginner: isBeginner, display_name: displayName }])
                .select('id, display_name')
                .single();
            if (insertError) throw insertError;
            return created;
        }

        async function addMusic() {
            if (!isAdminRole()) {
                showAppNotice('Μόνο οι διαχειριστές μπορούν να μεταφορτώνουν παρτιτούρες.');
                return;
            }
            const piece_title = document.getElementById('m-title').value.trim();

        function signedPdfErrorMessage(error) {
            const raw = String(error?.message || error || '');
            const lower = raw.toLowerCase();
            if (lower.includes('object not found') || lower.includes('not found') || lower.includes('404')) {
                return 'Το αρχείο δεν ήταν διαθέσιμο αυτή τη στιγμή. Δοκιμάστε ξανά. Αν το σήμα είναι αδύναμο, πλησιάστε στο Wi-Fi της αίθουσας.';
            }
            if (lower.includes('offline-missing')) {
                return 'Αυτή η παρτιτούρα δεν έχει αποθηκευτεί ακόμα σε αυτή τη συσκευή. Ανοίξτε την όταν έχετε σύνδεση.';
            }
            if (lower.includes('failed to fetch') || lower.includes('network') || lower.includes('abort') || lower.includes('timeout')) {
                return 'Αδύναμη σύνδεση. Δοκιμάστε ξανά όταν το σήμα είναι καλύτερο.';
            }
            return raw || 'Άγνωστο σφάλμα';
        }

        function isQuotaError(error) {
            return Boolean(error && (error.name === 'QuotaExceededError' || error.code === 22 || error.code === 1014));
        }

        async function fetchPdfBytesFromSignedUrl(signedUrl, timeoutMs = PDF_FETCH_MS) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(signedUrl, { signal: controller.signal });
                if (!res.ok) {
                    const body = await res.text().catch(() => '');
                    if (res.status === 404 || /object not found/i.test(body)) {
                        throw new Error('Object not found');
                    }
                    throw new Error(`Αδυναμία λήψης του PDF (${res.status}).`);
                }
                return new Uint8Array(await res.arrayBuffer());
            } catch (error) {
                if (error?.name === 'AbortError') {
                    throw new Error('timeout');
                }
                throw error;
            } finally {
                clearTimeout(timer);
            }
        }

        async function loadSignedPdfBytes(bucket, path, { retries = 1, timeoutMs = PDF_FETCH_MS } = {}) {
            const objectPath = decodeURIComponent(path);
            let lastError;
            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const { data, error } = await supabaseClient.storage
                        .from(bucket)
                        .createSignedUrl(objectPath, SIGNED_PDF_TTL_SEC);
                    if (error || !data?.signedUrl) {
                        throw error || new Error('Άγνωστο σφάλμα');
                    }
                    return await fetchPdfBytesFromSignedUrl(data.signedUrl, timeoutMs);
                } catch (e) {
                    lastError = e;
                    if (isQuotaError(e)) throw e;
                    if (attempt < retries) {
                        await new Promise((resolve) => setTimeout(resolve, 700 * (attempt + 1)));
                    }
                }
            }
            throw lastError;
        }

        async function bytesForSheetPdf(filePath, pieceId) {
            const path = decodeURIComponent(filePath);
            const userId = currentUser?.id;
            const cached = userId ? await scoresGetPdf(userId, pieceId) : null;
            const cacheHit = cached && samePdfPath(cached.pdfLink, path)
                ? new Uint8Array(cached.bytes.slice(0))
                : null;

            if (cacheHit) {
                if (navigator.onLine !== false && userId) {
                    loadSignedPdfBytes('sheet-music', path, { retries: 0 })
                        .then((fresh) => {
                            if (currentUser?.id !== userId) return;
                            return scoresPutPdf(userId, pieceId, path, fresh);
                        })
                        .then(() => {
                            if (document.getElementById('music-results')) paintMusicResults();
                        })
                        .catch(() => {});
                }
                return cacheHit;
            }

            if (navigator.onLine === false) {
                throw new Error('offline-missing');
            }

            const bytes = await loadSignedPdfBytes('sheet-music', path);
            if (userId && pieceId != null) {
                try {
                    await scoresPutPdf(userId, pieceId, path, bytes);
                    if (document.getElementById('music-results')) paintMusicResults();
                } catch (e) {
                    console.warn('score cache save failed', e);
                }
            }
            return bytes;
        }

        function isFullScoreItem(item) {
            const label = `${musicPartLabel(item)} ${item.instrument_part || ''} ${item.piece_title || ''}`.toLowerCase();
            return label.includes('full score') || label.includes('fullscore');
        }

        async function prefetchEntitledPdfs(music) {
            if (!currentUser?.id || !Array.isArray(music) || navigator.onLine === false) return;
            if (scorePrefetchQuotaAt && Date.now() - scorePrefetchQuotaAt < 10 * 60 * 1000) {
                updateMusicSyncStatus();
                return;
            }
            if (scorePrefetchInFlight) return scorePrefetchInFlight;
            const userId = currentUser.id;
            const queue = music.slice().sort((a, b) => Number(isFullScoreItem(a)) - Number(isFullScoreItem(b)));
            const gen = scorePrefetchGen;
            const run = (async () => {
                let painted = 0;
                updateMusicSyncStatus();
                const trySave = async (item, retries) => {
                    if (gen !== scorePrefetchGen || currentUser?.id !== userId) return 'abort';
                    if (!item?.pdf_link || item.id == null) return 'skip';
                    const existing = await scoresGetPdf(userId, item.id);
                    if (existing && samePdfPath(existing.pdfLink, item.pdf_link)) {
                        scorePrefetchFailedIds.delete(Number(item.id));
                        return 'skip';
                    }
                    try {
                        const bytes = await loadSignedPdfBytes('sheet-music', item.pdf_link, { retries });
                        let path = item.pdf_link;
                        try { path = decodeURIComponent(item.pdf_link); } catch {}
                        await scoresPutPdf(userId, item.id, path, bytes);
                        scorePrefetchFailedIds.delete(Number(item.id));
                        painted += 1;
                        updateMusicSyncStatus();
                        if (painted % 3 === 0 && document.getElementById('music-results')) paintMusicResults();
                        return 'ok';
                    } catch (e) {
                        if (isQuotaError(e)) {
                            scorePrefetchQuotaAt = Date.now();
                            updateMusicSyncStatus();
                            return 'quota';
                        }
                        scorePrefetchFailedIds.add(Number(item.id));
                        return 'fail';
                    }
                };
                for (const item of queue) {
                    const result = await trySave(item, 0);
                    if (result === 'abort' || result === 'quota') return;
                    await new Promise((resolve) => setTimeout(resolve, 80));
                }
                const missing = queue.filter((item) => item?.id != null && scorePrefetchFailedIds.has(Number(item.id)));
                for (const item of missing) {
                    const result = await trySave(item, 1);
                    if (result === 'abort' || result === 'quota') return;
                    await new Promise((resolve) => setTimeout(resolve, 200));
                }
                if (document.getElementById('music-results')) paintMusicResults();
                else updateMusicSyncStatus();
            })();
            scorePrefetchInFlight = run;
            run.finally(() => {
                if (scorePrefetchInFlight === run) scorePrefetchInFlight = null;
                updateMusicSyncStatus();
            });
            return run;
        }

        function safePdfFileName(title) {
            const base = String(title || 'partitura').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() || 'partitura';
            return `${base.slice(0, 80)}.pdf`;

        async function fetchSignedPdfFile(filePath, title, pieceId) {
            const bytes = await bytesForSheetPdf(filePath, pieceId);
            const original = new File([bytes], safePdfFileName(title), { type: 'application/pdf' });
            return stampSharedPdfFile(original);
